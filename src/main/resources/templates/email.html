<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모아모아 이메일 인증 ✉️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            padding: 20px;
            margin: 0;
            color: #333;
            text-align: center;
        }
        .email-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0px 4px 15px rgba(0, 123, 255, 0.2);
            text-align: center;
        }
        h1 {
            color: #007BFF;
            margin-bottom: 15px;
            font-size: 28px;
        }
        .emoji {
            font-size: 50px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 20px 0;
            color: #555;
        }
        .button {
            display: inline-block;
            background-color: #40A9FF; /* 더 밝은 블루 */
            color: #ffffff; /* 흰색 글씨 */
            text-decoration: none;
            padding: 14px 26px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0, 123, 255, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .button:hover {
            background-color: #69C0FF; /* 더 밝은 블루 */
            transform: scale(1.07);
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="emoji">📩🔗</div>
    <h1>모아모아 이메일 인증</h1>
    <p>안녕하세요, <strong>모아모아</strong> 서비스를 이용해주셔서 감사합니다. 🙌<br>
        아래 버튼을 클릭하여 이메일 인증을 완료해주세요.</p>
    <a th:href="${verificationUrl}" class="button">✨ 이메일 인증하기 ✨</a>
    <p class="footer">본 메일은 모아모아 서비스에서 자동 발송되었습니다.<br>문의 사항이 있으시면 고객센터로 연락해 주세요. 📞</p>
</div>
</body>
</html>
