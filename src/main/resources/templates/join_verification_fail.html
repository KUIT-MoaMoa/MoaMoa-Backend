<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 인증 실패 ❌</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffe6e6;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h1 {
            color: #e74c3c;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .emoji {
            font-size: 50px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="emoji">❌🚫</div>
    <h1>이메일 인증 실패</h1>
    <p>인증번호가 잘못되었거나 만료되었습니다. ⏳<br>다시 시도해 주세요.</p>
</div>
</body>
</html>
