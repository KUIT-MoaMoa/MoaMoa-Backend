<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 인증 실패 ❌🔒</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #ffe6e6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            color: #333;
            font-size: 22px;
        }
        .message {
            font-size: 18px;
            color: #FF5722;
            font-weight: bold;
            margin: 20px 0;
        }
        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .footer {
            font-size: 14px;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="emoji">❌🔒</div>
    <h2>비밀번호 재설정 인증 실패</h2>
    <p class="message">인증에 실패하였습니다.<br>인증 링크가 만료되었거나 잘못된 요청입니다.</p>
    <p class="footer">⚠️ 다시 인증을 요청해 주세요! ⚠️</p>
</div>
</body>
</html>
