<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 인증 성공 🔒✅</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #e3fcef;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            color: #333;
            font-size: 22px;
        }
        .message {
            font-size: 18px;
            color: #4CAF50;
            font-weight: bold;
            margin: 20px 0;
        }
        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .footer {
            font-size: 14px;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="emoji">🔒✅</div>
    <h2>비밀번호 재설정 인증 성공</h2>
    <p class="message">이메일 인증이 완료되었습니다! 🎊<br>이제 비밀번호를 변경할 수 있습니다.</p>
    <p class="footer">✨ 안전한 비밀번호를 설정하세요! ✨</p>
</div>
</body>
</html>
